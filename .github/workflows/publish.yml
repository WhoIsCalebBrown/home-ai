name: Publish Home AI images

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: home-ai-assistant
            file: assistant/Dockerfile
          - name: home-ai-tools
            file: tools/Dockerfile
          - name: pocket-tts
            file: pocket/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Install contract test dependencies
        run: python -m pip install --disable-pip-version-check pytest fastapi==0.115.6 httpx==0.28.1 pydantic==2.10.6
      - name: Run assistant grounding regressions
        if: matrix.name == 'home-ai-assistant'
        # qa/test_assistant_conversation_integration.py needs assistant's
        # full runtime deps (wyoming, nemo_text_processing/pynini) which are
        # deliberately NOT installed on this bare interpreter -- it is
        # excluded here and run in its own step below, inside the image
        # that actually has those deps.
        run: |
          python -m py_compile assistant/voice-api-app.py
          python -m pytest -q assistant/test_tts_audio.py assistant/test_openai_gateway.py assistant/test_deterministic_structured_rendering.py
          python -m pytest -q assistant/test_grounding_regressions.py qa --ignore=qa/test_assistant_conversation_integration.py
      - name: Run assistant conversation integration tests (production-shaped deps)
        if: matrix.name == 'home-ai-assistant'
        # assistant/requirements.txt (nemo_text_processing/pynini included)
        # only installs cleanly under the same base image/Python version as
        # assistant/Dockerfile -- this builds that exact image (not the
        # lightweight ubuntu-latest interpreter above) and runs the real
        # respond()-driving integration suite inside it, plus the full
        # dependency-light suite as a cross-check. See qa/Dockerfile.assistant_integration.
        run: |
          docker build -f qa/Dockerfile.assistant_integration -t home-ai-qa-assistant-integration:ci .
          docker run --rm home-ai-qa-assistant-integration:ci python -m pytest -q -o asyncio_mode=auto
      - name: Run tools contract regressions
        if: matrix.name == 'home-ai-tools'
        run: |
          python -m py_compile tools/server-tools-app.py
          python -m pip install --disable-pip-version-check pytest-asyncio==0.24.0
          python -m pytest -q -o asyncio_mode=auto tools/test_capability_discovery.py tools/test_canonical_identity.py tools/test_workflow_events.py tools/test_media_workflow_integration.py tools/test_tools_boundary_contract.py qa --ignore=qa/test_assistant_conversation_integration.py
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          tags: |
            type=sha
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

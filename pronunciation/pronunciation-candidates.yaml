# Review-only pronunciation candidates for Home-AI-Assistant.
# This file is intentionally inactive. It must not be loaded by production TTS
# until each proposed pronunciation has been listened to and approved.
version: 1
active: false
scope: tts-only
notes:
  - Display text, tool names, entity extraction, audit records, and API arguments must remain unchanged.
  - usage_proxy is an audit/tool-context count, not a count of every spoken occurrence.
  - Exact-token or bounded matching is required when this is activated.

